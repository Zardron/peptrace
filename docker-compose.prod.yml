# Production deployment for peptrace.co — plain Docker host, no Traefik.
#
# TLS is terminated in the frontend container with a Let's Encrypt
# certificate: nginx.prod.conf.template is rendered into the container by the
# nginx image's envsubst entrypoint (PEPTRACE_DOMAIN), port 80 serves only the
# ACME challenge + healthcheck + an HTTPS redirect, and port 443 serves the
# site (proxying /api/* to the api container over the internal network).
# The certbot service renews the certificate via the webroot every 12h; nginx
# picks up a renewed cert on restart (a weekly host cron restarts the frontend
# — see deploy.yml / the runbook notes in deploy.yml's production branch).
#
# The .env next to this file is generated by the deploy workflow (deploy.yml)
# from the 'production' GitHub environment — same variables as
# docker-compose.deploy.yml. COMPOSE_PROJECT_NAME is pinned there so each
# deploy replaces the previous containers.
#
# First issuance happens in the deploy workflow (certbot standalone) before
# this stack starts, because the HTTPS server block needs the cert files to
# exist. DNS for PEPTRACE_DOMAIN must point at this server and ports 80/443
# must be reachable from the internet.
#
# admin-portal (shared-services/admin-portal, its own repo/compose project)
# has no Traefik to front it on this server, so it joins this project's
# default Docker network ("peptrace_default") instead, and the frontend's
# nginx template gets a second server_name block for ADMIN_PORTAL_DOMAIN that
# proxies to it — see frontend/nginx.prod.conf.template. The Let's Encrypt
# cert issued below must cover both PEPTRACE_DOMAIN and ADMIN_PORTAL_DOMAIN
# (see deploy.yml).

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/peptrace/peptrace-frontend:latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PEPTRACE_DOMAIN: ${PEPTRACE_DOMAIN:?set PEPTRACE_DOMAIN in the .env}
      ADMIN_PORTAL_DOMAIN: ${ADMIN_PORTAL_DOMAIN:-admin.peptrace.co}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Rendered over the image's baked default.conf by the nginx entrypoint.
      - ./frontend/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./acme-webroot:/var/www/acme:ro

  api:
    image: ${API_IMAGE:-ghcr.io/peptrace/peptrace-api:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in the .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY in the .env}
      # Service-role key — required for native email/password auth (credentials
      # table + avatar storage). Server-only; never expose to the frontend.
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?set SUPABASE_SECRET_KEY in the .env}
      # Optional: signs native session tokens (falls back to SUPABASE_SECRET_KEY).
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}

  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./acme-webroot:/var/www/acme
    # Renew via the webroot served by the frontend's port 80. nginx only loads
    # a renewed cert on restart — handled by a weekly host cron (see header).
    entrypoint: >
      sh -c "trap 'exit 0' TERM;
      while :; do
        certbot renew --webroot -w /var/www/acme;
        sleep 12h & wait $$!;
      done"
