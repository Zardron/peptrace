# Deployment for the peptrace servers (Docker + Traefik already installed).
#
# Environments (same file on both servers, different .env):
#   staging    — peptrace.stg.esteemed.engineering (same VPS as figma-calc)
#   production — peptrace.co (separate server, not set up yet)
#
# Usage:
#   1. The deploy workflows stream the source into a per-commit release
#      directory (<slot>/releases/<sha>) on the server and generate the .env
#      there from GitHub environment variables/secrets (SUPABASE_URL,
#      SUPABASE_PUBLISHABLE_KEY, SUPABASE_ANON_KEY, SUPABASE_SECRET_KEY,
#      AUTH_SESSION_SECRET) — no manual .env needed.
#      COMPOSE_PROJECT_NAME is pinned in that .env so each release replaces
#      the previous release's containers.
#   2. PEPTRACE_DOMAIN / PEPTRACE_NAME / COMPOSE_PROJECT_NAME are also written
#      by the workflows (unique per slot, so the preview and staging routers
#      don't collide on the shared Traefik). Set TRAEFIK_NETWORK /
#      TRAEFIK_CERT_RESOLVER via environment if they differ from the defaults.
#   3. docker compose -f docker-compose.deploy.yml pull && docker compose -f docker-compose.deploy.yml up -d
#
# Routing: the frontend serves the domain root, the API serves /api/* (the
# /api prefix is stripped before requests reach the container, so the API
# keeps its plain routes like /health).
#
# The images are built and published by GitHub Actions (see .github/workflows/docker.yml).

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/peptrace/peptrace-frontend:latest}
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.${PEPTRACE_NAME:-peptrace}.rule=Host(`${PEPTRACE_DOMAIN:?set PEPTRACE_DOMAIN}`)
      - traefik.http.routers.${PEPTRACE_NAME:-peptrace}.entrypoints=websecure
      - traefik.http.routers.${PEPTRACE_NAME:-peptrace}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.${PEPTRACE_NAME:-peptrace}.loadbalancer.server.port=80

  api:
    image: ${API_IMAGE:-ghcr.io/peptrace/peptrace-api:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in the slot .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY in the slot .env}
      # Service-role key — required for native email/password auth (credentials
      # table + avatar storage). Server-only; never expose to the frontend.
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?set SUPABASE_SECRET_KEY in the slot .env}
      # Optional: signs native session tokens (falls back to SUPABASE_SECRET_KEY).
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.${PEPTRACE_NAME:-peptrace}-api.rule=Host(`${PEPTRACE_DOMAIN:?set PEPTRACE_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.${PEPTRACE_NAME:-peptrace}-api.priority=100
      - traefik.http.routers.${PEPTRACE_NAME:-peptrace}-api.entrypoints=websecure
      - traefik.http.routers.${PEPTRACE_NAME:-peptrace}-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${PEPTRACE_NAME:-peptrace}-api.middlewares=${PEPTRACE_NAME:-peptrace}-api-strip
      - traefik.http.middlewares.${PEPTRACE_NAME:-peptrace}-api-strip.stripprefix.prefixes=/api
      - traefik.http.services.${PEPTRACE_NAME:-peptrace}-api.loadbalancer.server.port=3000

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-web}