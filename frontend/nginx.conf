server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Hashed build artifacts are immutable. Never fall back to index.html here:
    # a missing asset must be a 404, not an HTML page that breaks module loads.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Always revalidate the HTML shell so a new deploy takes effect on the
        # next page load instead of serving a stale asset manifest.
        add_header Cache-Control "no-cache";
    }
}
