server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Hashed build artifacts are immutable. Never fall back to index.html here:
    # a missing asset must be a 404, not an HTML page that breaks module loads.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API reverse proxy. On staging/preview Traefik routes /api before requests
    # reach this container, so this block is only exercised on the production
    # VPS (no Traefik). Resolved at request time via Docker's embedded DNS so
    # nginx starts even if the api container isn't up yet.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Always revalidate the HTML shell so a new deploy takes effect on the
        # next page load instead of serving a stale asset manifest.
        add_header Cache-Control "no-cache";
    }
}
