name: deploy-preview

# Deploys a PR to the shared preview slot on the staging VPS and then notifies
# the Software Factory Visual QA workflow (n8n) so it can screenshot the
# deployed UI and compare it against the Figma designs.
#
# Fires on PRs targeting main or a feat/** branch. Only services whose code
# changed relative to the PR base are built and deployed:
#   - changes under frontend/ -> build + deploy frontend (frontend/Dockerfile)
#   - changes under api/      -> build + deploy api (api/Dockerfile)
# PRs that touch neither (e.g. plan-only PRs) skip the deploy entirely.
#
# Server-side layout (staging VPS, same host as staging):
#   /home/github/services/peptrace/preview/releases/<sha>/  — one directory per
#   deploy, holding the PR's merged source plus a generated .env. The .env is
#   written by this workflow from the 'staging' GitHub environment
#   (variables: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY; secret:
#   SUPABASE_ANON_KEY) — no manually maintained .env on the server.
#   COMPOSE_PROJECT_NAME is pinned in the .env so a new release replaces the
#   previous containers instead of creating a parallel stack.
#
# One-time server setup:
#   1. Point DNS for the preview domain(s) at the VPS.
#   2. Make sure the `staging` environment has SERVER_IP + SSH_PRIVATE_KEY
#      (same ones deploy.yml uses) and the SUPABASE_* values above.
#
# NOTE: the preview slot is shared — the latest PR deploy wins. If the branch
# name contains an issue number, the workflow also notifies visual QA.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # main: feature PRs. feat/**: Visual QA fix PRs, which the factory
    # stacks onto the feature branch being fixed (visual-qa/* -> feat/*).
    branches: [main, 'feat/**']

# Single shared preview slot: serialize deploys.
concurrency:
  group: preview-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PREVIEW_URL: https://preview.peptrace.stg.esteemed.engineering
  N8N_VISUAL_QA_WEBHOOK: https://n8n.esteemed.engineering/webhook/factory/visual-qa
  BRANCH: ${{ github.event.pull_request.head.ref }}
  SHA: ${{ github.event.pull_request.head.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'api/**'

      - name: Detect services to deploy
        id: detect
        env:
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
        run: |
          set -euo pipefail
          SERVICES=""
          MATRIX="[]"
          add() {
            SERVICES="$SERVICES $1"
            MATRIX=$(jq -c --arg s "$1" --arg c "$2" --arg d "$3" --arg t "$4" \
              '. + [{suffix:$s, context:$c, dockerfile:$d, target:$t}]' <<<"$MATRIX")
          }
          [ "$FRONTEND_CHANGED" = "true" ] && add frontend ./frontend ./frontend/Dockerfile runtime
          [ "$BACKEND_CHANGED" = "true" ] && add api ./api ./api/Dockerfile runtime
          SERVICES=$(echo $SERVICES | xargs)
          echo "Changed services: ${SERVICES:-none}"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<<"$MATRIX")" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Short SHA
        run: echo "SHA_SHORT=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}-${{ matrix.suffix }}:sha-${{ env.SHA_SHORT }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Extract issue number
        id: issue
        run: |
          echo "SHA_SHORT=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_ENV"
          ISSUE_NUMBER=$(echo "$BRANCH" | grep -oE "[0-9]+" | head -n1 || true)
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "Branch $BRANCH contains no issue number; preview deploy will continue without visual QA notification."
            echo "has_issue=false" >> "$GITHUB_OUTPUT"
            echo "number=0" >> "$GITHUB_OUTPUT"
          else
            echo "has_issue=true" >> "$GITHUB_OUTPUT"
            echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Sync source to preview release directory
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ vars.SERVER_IP || secrets.SERVER_IP }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          RELEASE_DIR="/home/github/services/peptrace/preview/releases/$SHA"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (variables) and SUPABASE_ANON_KEY (secret) must be set on the 'staging' GitHub environment."
            exit 1
          fi
          install -m 600 /dev/null ssh_key
          printf '%s\n' "$SSH_KEY" > ssh_key
          SSH="ssh -i ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null github@$HOST"
          # Each deploy gets a fresh per-commit directory — no clearing of a
          # shared slot, so no "directory not empty" failures. The server has
          # no outbound access to github.com, so the runner (which can)
          # streams the source over SSH instead.
          # checkout defaults to the PR merge commit, matching what the
          # build job builds the images from.
          $SSH "mkdir -p '$RELEASE_DIR'"
          tar --exclude=.git --exclude=ssh_key -czf - . | $SSH "tar -xzf - -C '$RELEASE_DIR'"
          rm -f ssh_key
          # The .env is generated from GitHub environment configuration.
          $SSH "cat > '$RELEASE_DIR/.env' && chmod 600 '$RELEASE_DIR/.env'" <<ENVEOF
          PEPTRACE_DOMAIN=preview.peptrace.stg.esteemed.engineering
          PEPTRACE_NAME=peptrace-preview
          COMPOSE_PROJECT_NAME=peptrace-preview
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          ENVEOF

      - name: Deploy preview to VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_FRONTEND_IMAGE: ${{ env.IMAGE_NAME }}-frontend:sha-${{ env.SHA_SHORT }}
          DEPLOY_API_IMAGE: ${{ env.IMAGE_NAME }}-api:sha-${{ env.SHA_SHORT }}
          DEPLOY_SERVICES: ${{ needs.changes.outputs.services }}
          RELEASE_DIR: /home/github/services/peptrace/preview/releases/${{ env.SHA }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.PAT }}
        with:
          host: ${{ vars.SERVER_IP || secrets.SERVER_IP }}
          username: github
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_FRONTEND_IMAGE,DEPLOY_API_IMAGE,DEPLOY_SERVICES,RELEASE_DIR,GHCR_USER,GHCR_PAT
          script: |
            set -euo pipefail
            cd "$RELEASE_DIR"
            export FRONTEND_IMAGE="$DEPLOY_FRONTEND_IMAGE"
            export API_IMAGE="$DEPLOY_API_IMAGE"
            echo "Deploying preview services: $DEPLOY_SERVICES (frontend: $FRONTEND_IMAGE, api: $API_IMAGE)"
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Tear down the legacy fixed-directory stack if it is still
            # running (pre-release-dirs layout); no-op once it's gone.
            docker compose -p preview -f /home/github/services/peptrace/preview/docker-compose.deploy.yml down --remove-orphans 2>/dev/null || true
            # Only the changed services are pulled/recreated — unchanged ones keep running.
            docker compose -f docker-compose.deploy.yml pull $DEPLOY_SERVICES
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans $DEPLOY_SERVICES
            for service in $DEPLOY_SERVICES; do
              cid="$(docker compose -f docker-compose.deploy.yml ps -q "$service")"
              for i in $(seq 1 24); do
                status="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)"
                echo "$service health: $status ($i/24)"
                [ "$status" = "healthy" ] && break
                [ "$i" = "24" ] && { echo "$service container did not become healthy"; exit 1; }
                sleep 5
              done
            done
            docker image prune -f
            # Prune old release directories, keeping the current and previous.
            cd /home/github/services/peptrace/preview/releases
            ls -1t | tail -n +3 | xargs -r rm -rf
            echo "Preview deployed."

      - name: Notify Visual QA workflow
        if: steps.issue.outputs.has_issue == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$N8N_VISUAL_QA_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"owner\": \"${{ github.repository_owner }}\",
              \"repository\": \"${{ github.event.repository.name }}\",
              \"branch\": \"$BRANCH\",
              \"issueNumber\": \"$ISSUE_NUMBER\",
              \"prNumber\": \"$PR_NUMBER\",
              \"previewUrl\": \"$PREVIEW_URL\",
              \"sha\": \"$SHA\"
            }"
          echo "Visual QA workflow notified."
