name: deploy-preview

# Deploys a PR to the shared preview slot on the staging VPS and then notifies
# the Software Factory Visual QA workflow (n8n) so it can screenshot the
# deployed UI and compare it against the Figma designs.
#
# Fires on PRs targeting main. Only services whose code changed relative to
# main are built and deployed:
#   - changes under frontend/                     -> build + deploy frontend
#   - changes under api/, packages/ or the root
#     Docker build files                          -> build + deploy api, admin,
#                                                    client-api (all built from
#                                                    the root Dockerfile)
# PRs that touch neither (e.g. plan-only PRs) skip the deploy entirely.
#
# One-time server setup (staging VPS, same host as staging):
#   1. Create /home/github/peptrace/preview/ with a .env that sets
#      PEPTRACE_DOMAIN=preview.peptrace.stg.esteemed.engineering,
#      PEPTRACE_NAME=peptrace-preview (unique Traefik router names, so the
#      preview and staging slots don't collide on the shared Traefik) and
#      ADMIN_DOMAIN=preview-admin.peptrace.stg.esteemed.engineering.
#      The deploy step clones the PR head commit into this directory itself
#      (git must be installed on the server); the .env is gitignored and
#      survives the checkout.
#   2. Point DNS for the preview domain(s) at the VPS.
#   3. Make sure the `staging` environment has SERVER_IP + SSH_PRIVATE_KEY
#      (same ones deploy.yml uses).
#
# NOTE: the preview slot is shared — the latest PR deploy wins. If the branch
# name contains an issue number, the workflow also notifies visual QA.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Single shared preview slot: serialize deploys.
concurrency:
  group: preview-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PREVIEW_URL: https://preview.peptrace.stg.esteemed.engineering
  N8N_VISUAL_QA_WEBHOOK: https://n8n.esteemed.engineering/webhook/factory/visual-qa
  BRANCH: ${{ github.event.pull_request.head.ref }}
  SHA: ${{ github.event.pull_request.head.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'api/**'
              - 'packages/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'

      - name: Detect services to deploy
        id: detect
        env:
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
        run: |
          set -euo pipefail
          SERVICES=""
          MATRIX="[]"
          add() {
            SERVICES="$SERVICES $1"
            MATRIX=$(jq -c --arg s "$1" --arg c "$2" --arg d "$3" --arg t "$4" \
              '. + [{suffix:$s, context:$c, dockerfile:$d, target:$t}]' <<<"$MATRIX")
          }
          [ "$FRONTEND_CHANGED" = "true" ] && add frontend ./frontend ./frontend/Dockerfile runtime
          if [ "$BACKEND_CHANGED" = "true" ]; then
            add api . ./Dockerfile platform-api-prod
            add admin . ./Dockerfile admin-prod
            add client-api . ./Dockerfile client-api-prod
          fi
          SERVICES=$(echo $SERVICES | xargs)
          echo "Changed services: ${SERVICES:-none}"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<<"$MATRIX")" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Short SHA
        run: echo "SHA_SHORT=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}-${{ matrix.suffix }}:sha-${{ env.SHA_SHORT }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Extract issue number
        id: issue
        run: |
          echo "SHA_SHORT=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_ENV"
          ISSUE_NUMBER=$(echo "$BRANCH" | grep -oE "[0-9]+" | head -n1 || true)
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "Branch $BRANCH contains no issue number; preview deploy will continue without visual QA notification."
            echo "has_issue=false" >> "$GITHUB_OUTPUT"
            echo "number=0" >> "$GITHUB_OUTPUT"
          else
            echo "has_issue=true" >> "$GITHUB_OUTPUT"
            echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy preview to VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_FRONTEND_IMAGE: ${{ env.IMAGE_NAME }}-frontend:sha-${{ env.SHA_SHORT }}
          DEPLOY_ADMIN_IMAGE: ${{ env.IMAGE_NAME }}-admin:sha-${{ env.SHA_SHORT }}
          DEPLOY_API_IMAGE: ${{ env.IMAGE_NAME }}-api:sha-${{ env.SHA_SHORT }}
          DEPLOY_CLIENT_API_IMAGE: ${{ env.IMAGE_NAME }}-client-api:sha-${{ env.SHA_SHORT }}
          DEPLOY_SERVICES: ${{ needs.changes.outputs.services }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ env.SHA }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.PAT }}
        with:
          host: ${{ vars.SERVER_IP || secrets.SERVER_IP }}
          username: github
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_FRONTEND_IMAGE,DEPLOY_ADMIN_IMAGE,DEPLOY_API_IMAGE,DEPLOY_CLIENT_API_IMAGE,DEPLOY_SERVICES,REPO,TARGET_SHA,GHCR_USER,GHCR_PAT
          script: |
            set -euo pipefail
            # Sync the PR head commit into the preview slot so the compose file
            # and config come from the PR. The .env in that directory is
            # untracked (gitignored), so reset --hard keeps it.
            DEPLOY_DIR="/home/github/peptrace/preview"
            REPO_URL="https://x-access-token:${GHCR_PAT}@github.com/${REPO}.git"
            echo "Syncing $REPO@$TARGET_SHA into $DEPLOY_DIR"
            mkdir -p "$DEPLOY_DIR"
            [ -d "$DEPLOY_DIR/.git" ] || git -C "$DEPLOY_DIR" init -q
            git -C "$DEPLOY_DIR" fetch -q --depth 1 "$REPO_URL" "$TARGET_SHA"
            git -C "$DEPLOY_DIR" reset -q --hard FETCH_HEAD
            cd "$DEPLOY_DIR"
            export FRONTEND_IMAGE="$DEPLOY_FRONTEND_IMAGE"
            export ADMIN_IMAGE="$DEPLOY_ADMIN_IMAGE"
            export API_IMAGE="$DEPLOY_API_IMAGE"
            export CLIENT_API_IMAGE="$DEPLOY_CLIENT_API_IMAGE"
            echo "Deploying preview services: $DEPLOY_SERVICES (frontend: $FRONTEND_IMAGE, admin: $ADMIN_IMAGE, api: $API_IMAGE, client-api: $CLIENT_API_IMAGE)"
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Only the changed services are pulled/recreated — unchanged ones keep running.
            docker compose -f docker-compose.deploy.yml pull $DEPLOY_SERVICES
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans $DEPLOY_SERVICES
            for service in $DEPLOY_SERVICES; do
              cid="$(docker compose -f docker-compose.deploy.yml ps -q "$service")"
              for i in $(seq 1 24); do
                status="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)"
                echo "$service health: $status ($i/24)"
                [ "$status" = "healthy" ] && break
                [ "$i" = "24" ] && { echo "$service container did not become healthy"; exit 1; }
                sleep 5
              done
            done
            docker image prune -f
            echo "Preview deployed."

      - name: Notify Visual QA workflow
        if: steps.issue.outputs.has_issue == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$N8N_VISUAL_QA_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"owner\": \"${{ github.repository_owner }}\",
              \"repository\": \"${{ github.event.repository.name }}\",
              \"branch\": \"$BRANCH\",
              \"issueNumber\": \"$ISSUE_NUMBER\",
              \"prNumber\": \"$PR_NUMBER\",
              \"previewUrl\": \"$PREVIEW_URL\",
              \"sha\": \"$SHA\"
            }"
          echo "Visual QA workflow notified."
