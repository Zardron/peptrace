name: Trigger Planner Agent

on:
  create:

jobs:
  trigger-planner:
    # Only fires when a feature branch named feat/<issue>_<name> is created,
    # e.g. feat/1234_user-dashboard -> issue 1234.
    if: github.event.ref_type == 'branch' && startsWith(github.ref, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - name: Extract issue number from branch name
        id: branch
        env:
          BRANCH: ${{ github.ref }}
        run: |
          ISSUE_NUMBER=$(echo "$BRANCH" | sed -E 's/^feat\/([0-9]+)_.+/\1/')
          if [ "$ISSUE_NUMBER" = "$BRANCH" ]; then
            echo "Branch '$BRANCH' does not match 'feat/<issue-number>_<name>' — skipping."
            echo "issue_number=" >> "$GITHUB_OUTPUT"
          else
            echo "Detected issue number: $ISSUE_NUMBER"
            echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Factory Planner Agent
        if: steps.branch.outputs.issue_number != ''
        env:
          N8N_WEBHOOK_URL: https://n8n.esteemed.engineering/webhook/factory/plan-issue
          BRANCH: ${{ github.ref }}
          ISSUE_NUMBER: ${{ steps.branch.outputs.issue_number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          curl --fail-with-body -sS -X POST "$N8N_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"owner\": \"$REPO_OWNER\",
              \"repository\": \"$REPO_NAME\",
              \"branch\": \"$BRANCH\",
              \"issueNumber\": $ISSUE_NUMBER
            }"
          echo
          echo "Factory Planner Agent triggered for issue #$ISSUE_NUMBER on branch '$BRANCH'."
