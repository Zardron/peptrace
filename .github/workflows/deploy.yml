name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      service:
        description: "Service to deploy"
        required: true
        type: choice
        default: both
        options:
          - both
          - frontend
          - api
      tag:
        description: "Image tag to deploy (e.g. sha-f8c7e79)"
        required: false
        type: string
        default: latest

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Resolve services to deploy
        run: |
          if [ "${{ inputs.service }}" = "both" ]; then
            echo "SERVICES=frontend api" >> "$GITHUB_ENV"
          else
            echo "SERVICES=${{ inputs.service }}" >> "$GITHUB_ENV"
          fi

      - name: Check SERVER_IP configuration
        run: |
          echo "vars.SERVER_IP:    '${{ vars.SERVER_IP }}'"
          echo "secrets.SERVER_IP is $([ -n '${{ secrets.SERVER_IP }}' ] && echo 'set (masked)' || echo 'not set')"
          if [ -z '${{ vars.SERVER_IP }}' ] && [ -z '${{ secrets.SERVER_IP }}' ]; then
            echo "::error::SERVER_IP is empty. Add it to the '${{ inputs.environment }}' environment as a variable OR a secret."
            exit 1
          fi

      - name: Check SSH_PRIVATE_KEY length
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          len=${#SSH_PRIVATE_KEY}
          echo "SSH_PRIVATE_KEY length: $len characters"
          if [ "$len" -eq 0 ]; then
            echo "::error::SSH_PRIVATE_KEY is empty. Add it to the '${{ inputs.environment }}' environment secrets."
            exit 1
          fi

      - name: Verify SSH connectivity
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ vars.SERVER_IP || secrets.SERVER_IP }}
          SERVER_USER: ${{ vars.SERVER_USER || 'github' }}
        run: |
          set -euo pipefail
          echo "Resolved SSH login: '$SERVER_USER'@$HOST"
          install -m 600 /dev/null ssh_key
          printf '%s\n' "$SSH_KEY" > ssh_key
          trap 'rm -f ssh_key' EXIT
          # Fingerprint of the key GitHub will offer — compare against the
          # public key in the server's authorized_keys:
          #   ssh-keygen -lf ~/.ssh/<your-key>.pub   (locally)
          ssh-keygen -lf ssh_key
          ssh -i ssh_key -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$HOST" 'echo "SSH OK, logged in as: $(whoami), home: $HOME"'

      - name: Checkout source to sync
        if: inputs.environment == 'staging'
        uses: actions/checkout@v4

      - name: Sync source to staging release directory
        if: inputs.environment == 'staging'
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ vars.SERVER_IP || secrets.SERVER_IP }}
          SERVER_USER: ${{ vars.SERVER_USER || 'github' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
        run: |
          set -euo pipefail
          RELEASE_DIR="/home/$SERVER_USER/services/peptrace/stg/releases/${{ github.sha }}"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (variables) and SUPABASE_ANON_KEY (secret) must be set on the '${{ inputs.environment }}' GitHub environment."
            exit 1
          fi
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY (service-role key, needed for native auth) must be set on the '${{ inputs.environment }}' GitHub environment secrets."
            exit 1
          fi
          # AUTH_SESSION_SECRET is optional: the API falls back to
          # SUPABASE_SECRET_KEY for signing native session tokens.
          install -m 600 /dev/null ssh_key
          printf '%s\n' "$SSH_KEY" > ssh_key
          trap 'rm -f ssh_key' EXIT
          SSH="ssh -i ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SERVER_USER@$HOST"
          # Each deploy gets a fresh per-commit directory — no clearing of a
          # shared slot, so no "directory not empty" failures. The server has
          # no outbound access to github.com, so the runner (which can)
          # streams the source over SSH instead.
          $SSH "mkdir -p '$RELEASE_DIR'"
          tar --exclude=.git --exclude=ssh_key -czf - . | $SSH "tar -xzf - -C '$RELEASE_DIR'"
          # The .env is generated from GitHub environment configuration.
          $SSH "cat > '$RELEASE_DIR/.env' && chmod 600 '$RELEASE_DIR/.env'" <<ENVEOF
          PEPTRACE_DOMAIN=peptrace.stg.esteemed.engineering
          PEPTRACE_NAME=peptrace
          COMPOSE_PROJECT_NAME=peptrace
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY
          AUTH_SESSION_SECRET=$AUTH_SESSION_SECRET
          ENVEOF

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_FRONTEND_IMAGE: ${{ env.IMAGE_NAME }}-frontend:${{ env.TAG }}
          DEPLOY_API_IMAGE: ${{ env.IMAGE_NAME }}-api:${{ env.TAG }}
          DEPLOY_SERVICES: ${{ env.SERVICES }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_DIR: /home/${{ vars.SERVER_USER || 'github' }}/services/peptrace/stg/releases/${{ github.sha }}
          PROD_DIR: /home/${{ vars.SERVER_USER || 'github' }}/services/peptrace
          PEPTRACE_DOMAIN: ${{ vars.PEPTRACE_DOMAIN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.PAT }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.SERVER_IP || secrets.SERVER_IP }}
          username: ${{ vars.SERVER_USER || 'github' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_FRONTEND_IMAGE,DEPLOY_API_IMAGE,DEPLOY_SERVICES,DEPLOY_ENVIRONMENT,DEPLOY_SHA,GITHUB_REPO,RELEASE_DIR,PROD_DIR,PEPTRACE_DOMAIN,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,SUPABASE_ANON_KEY,SUPABASE_SECRET_KEY,AUTH_SESSION_SECRET,GHCR_USER,GHCR_PAT,GIT_TOKEN
          script: |
            set -euo pipefail
            if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
              # Production server: ~/services/peptrace is a git clone of this
              # repository (the server has outbound access to github.com, so
              # unlike staging there is no need to stream source over SSH).
              if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
                echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (variables) and SUPABASE_ANON_KEY (secret) must be set on the 'production' GitHub environment."
                exit 1
              fi
              if [ -z "$SUPABASE_SECRET_KEY" ]; then
                echo "::error::SUPABASE_SECRET_KEY (service-role key) must be set on the 'production' GitHub environment secrets."
                exit 1
              fi
              mkdir -p ~/services
              # Clone/fetch with the workflow's GITHUB_TOKEN, which always has
              # read access to this repository — no PAT scope needed. The token
              # expires when the job ends; the scrubbed remote URL is re-set
              # with a fresh token on every deploy.
              REPO_URL="https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPO}.git"
              if [ ! -d "$PROD_DIR/.git" ]; then
                git clone "$REPO_URL" "$PROD_DIR"
              fi
              cd "$PROD_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch origin
              git checkout --detach "$DEPLOY_SHA"
              git remote set-url origin "https://github.com/${GITHUB_REPO}.git"
              {
                echo "PEPTRACE_DOMAIN=${PEPTRACE_DOMAIN:-peptrace.co}"
                echo "PEPTRACE_NAME=peptrace"
                echo "COMPOSE_PROJECT_NAME=peptrace"
                echo "SUPABASE_URL=$SUPABASE_URL"
                echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
                echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
                echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
                echo "AUTH_SESSION_SECRET=$AUTH_SESSION_SECRET"
              } > .env
              chmod 600 .env
            else
              cd "$RELEASE_DIR"
            fi
            export FRONTEND_IMAGE="$DEPLOY_FRONTEND_IMAGE"
            export API_IMAGE="$DEPLOY_API_IMAGE"
            echo "Deploying services: $DEPLOY_SERVICES (frontend: $FRONTEND_IMAGE, api: $API_IMAGE)"
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if [ "$DEPLOY_ENVIRONMENT" = "staging" ]; then
              # Tear down the legacy fixed-directory stack if it is still
              # running (pre-release-dirs layout); no-op once it's gone.
              # Label-based removal works even if the old slot's .env or
              # compose file no longer evaluates.
              legacy_ids=$(docker ps -aq --filter "label=com.docker.compose.project=stg")
              [ -n "$legacy_ids" ] && docker rm -f $legacy_ids || true
            fi
            # Remove stray containers from older/manual stacks still publishing
            # this slot's domain. Traefik round-robins across every container
            # whose router rule matches the Host, so a leftover container with
            # an old build breaks every other page load (module scripts get
            # index.html from the wrong container).
            if [ -f .env ]; then
              DOMAIN=$(grep -E '^PEPTRACE_DOMAIN=' .env | cut -d= -f2-)
              PROJECT=$(grep -E '^COMPOSE_PROJECT_NAME=' .env | cut -d= -f2-)
              for cid in $(docker ps -q); do
                case "$(docker inspect --format '{{ json .Config.Labels }}' "$cid")" in
                  *"$DOMAIN"*) ;;
                  *) continue ;;
                esac
                proj=$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$cid")
                if [ "$proj" != "$PROJECT" ]; then
                  echo "Removing stray container $cid (project: ${proj:-unknown}) publishing $DOMAIN"
                  docker rm -f "$cid"
                fi
              done
            fi
            # Production has no Traefik on the host: it uses the plain compose
            # file (ports published directly, frontend nginx proxies /api).
            # Staging/preview route through the shared Traefik instead.
            if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
              COMPOSE_FILE=docker-compose.prod.yml
            else
              COMPOSE_FILE=docker-compose.deploy.yml
            fi
            docker compose -f "$COMPOSE_FILE" pull $DEPLOY_SERVICES
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans $DEPLOY_SERVICES
            for service in $DEPLOY_SERVICES; do
              cid="$(docker compose -f "$COMPOSE_FILE" ps -q "$service")"
              for i in $(seq 1 24); do
                status="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)"
                echo "$service health: $status ($i/24)"
                [ "$status" = "healthy" ] && break
                [ "$i" = "24" ] && { echo "$service container did not become healthy"; exit 1; }
                sleep 5
              done
            done
            docker image prune -f
            if [ "$DEPLOY_ENVIRONMENT" = "staging" ]; then
              # Prune old release directories, keeping the current and previous.
              cd "$RELEASE_DIR/.."
              ls -1t | tail -n +3 | xargs -r rm -rf
            fi
            echo "Deployed $DEPLOY_SERVICES"
