name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      service:
        description: "Service to deploy"
        required: true
        type: choice
        default: both
        options:
          - both
          - frontend
          - api
      tag:
        description: "Image tag to deploy (e.g. sha-f8c7e79)"
        required: false
        type: string
        default: latest

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Resolve services to deploy
        run: |
          if [ "${{ inputs.service }}" = "both" ]; then
            echo "SERVICES=frontend api" >> "$GITHUB_ENV"
          else
            echo "SERVICES=${{ inputs.service }}" >> "$GITHUB_ENV"
          fi

      - name: Check SERVER_IP configuration
        run: |
          echo "vars.SERVER_IP:    '${{ vars.SERVER_IP }}'"
          echo "secrets.SERVER_IP is $([ -n '${{ secrets.SERVER_IP }}' ] && echo 'set (masked)' || echo 'not set')"
          if [ -z '${{ vars.SERVER_IP }}' ] && [ -z '${{ secrets.SERVER_IP }}' ]; then
            echo "::error::SERVER_IP is empty. Add it to the '${{ inputs.environment }}' environment as a variable OR a secret."
            exit 1
          fi

      - name: Check SSH_PRIVATE_KEY length
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          len=${#SSH_PRIVATE_KEY}
          echo "SSH_PRIVATE_KEY length: $len characters"
          if [ "$len" -eq 0 ]; then
            echo "::error::SSH_PRIVATE_KEY is empty. Add it to the '${{ inputs.environment }}' environment secrets."
            exit 1
          fi

      - name: Checkout source to sync
        if: inputs.environment == 'staging'
        uses: actions/checkout@v4

      - name: Sync source to staging directory
        if: inputs.environment == 'staging'
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ vars.SERVER_IP || secrets.SERVER_IP }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="/home/github/peptrace/stg"
          install -m 600 /dev/null ssh_key
          printf '%s\n' "$SSH_KEY" > ssh_key
          SSH="ssh -i ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null github@$HOST"
          $SSH "mkdir -p '$DEPLOY_DIR'"
          if ! $SSH "test -f '$DEPLOY_DIR/.env'"; then
            echo "::error::$DEPLOY_DIR/.env is missing. Create it on the server with PEPTRACE_DOMAIN and TRAEFIK_NETWORK before deploying."
            rm -f ssh_key
            exit 1
          fi
          # The server has no outbound access to github.com, so it cannot
          # clone — the runner (which can) streams the source over SSH
          # instead. The slot is cleared first, except the untracked .env.
          $SSH "find '$DEPLOY_DIR' -mindepth 1 ! -name '.env' -delete"
          tar --exclude=.git --exclude=ssh_key -czf - . | $SSH "tar -xzf - -C '$DEPLOY_DIR'"
          rm -f ssh_key

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_FRONTEND_IMAGE: ${{ env.IMAGE_NAME }}-frontend:${{ env.TAG }}
          DEPLOY_API_IMAGE: ${{ env.IMAGE_NAME }}-api:${{ env.TAG }}
          DEPLOY_SERVICES: ${{ env.SERVICES }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.PAT }}
        with:
          host: ${{ vars.SERVER_IP || secrets.SERVER_IP }}
          username: github
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_FRONTEND_IMAGE,DEPLOY_API_IMAGE,DEPLOY_SERVICES,DEPLOY_ENVIRONMENT,GHCR_USER,GHCR_PAT
          script: |
            set -euo pipefail
            if [ "$DEPLOY_ENVIRONMENT" = "staging" ]; then
              cd /home/github/peptrace/stg
            else
              # Production server path is not set up yet; keep previous behavior.
              cd ~/services/peptrace/stg
            fi
            export FRONTEND_IMAGE="$DEPLOY_FRONTEND_IMAGE"
            export API_IMAGE="$DEPLOY_API_IMAGE"
            echo "Deploying services: $DEPLOY_SERVICES (frontend: $FRONTEND_IMAGE, api: $API_IMAGE)"
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.deploy.yml pull $DEPLOY_SERVICES
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans $DEPLOY_SERVICES
            for service in $DEPLOY_SERVICES; do
              cid="$(docker compose -f docker-compose.deploy.yml ps -q "$service")"
              for i in $(seq 1 24); do
                status="$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)"
                echo "$service health: $status ($i/24)"
                [ "$status" = "healthy" ] && break
                [ "$i" = "24" ] && { echo "$service container did not become healthy"; exit 1; }
                sleep 5
              done
            done
            docker image prune -f
            echo "Deployed $DEPLOY_SERVICES"
