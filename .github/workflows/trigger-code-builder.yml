name: Trigger Code Builder Agent

# Manual dispatch (Actions tab -> Trigger Code Builder Agent -> Run workflow).
# Resolves the PR head branch + issue number, creates a "Code Builder Agent"
# check run on the PR head commit (shown in the PR checks), and calls the n8n
# Code Builder agent, which marks the check completed with the build report.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to build"
        required: true
        type: number

permissions:
  checks: write
  contents: read

jobs:
  dispatch-builder:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR, create check run, dispatch Code Builder agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          BRANCH=$(gh api "repos/$REPO/pulls/$PR" --jq .head.ref)
          ISSUE_NUMBER=$(echo "$BRANCH" | grep -oE "[0-9]+" | head -n1)
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "Branch $BRANCH contains no issue number."
            exit 1
          fi
          CHECK_RUN_ID=$(gh api "repos/$REPO/check-runs" \
            -f name="Code Builder Agent" \
            -f head_sha="$HEAD_SHA" \
            -f status="in_progress" \
            -f "output[title]=Code Builder Agent" \
            -f "output[summary]=Dispatched to the n8n Code Builder agent for issue #$ISSUE_NUMBER..." \
            --jq .id)
          echo "Check run $CHECK_RUN_ID created on $HEAD_SHA"
          curl -sf -X POST "https://n8n.esteemed.engineering/webhook/factory/build-issue" \
            -H "Content-Type: application/json" \
            -d "{\"owner\":\"$OWNER\",\"repository\":\"$REPO_NAME\",\"branch\":\"$BRANCH\",\"issueNumber\":$ISSUE_NUMBER,\"prNumber\":$PR,\"checkRunId\":$CHECK_RUN_ID,\"headSha\":\"$HEAD_SHA\"}"
          echo "Code Builder agent dispatched."
