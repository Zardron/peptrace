name: bootstrap-supabase

# One-shot: copy public schema from OLD_DATABASE_URL → DATABASE_URL, then load
# catalog seed tables (vendors / peptides / tests / products / site content).
# Direct Supabase DB hosts are IPv6-only; GitHub-hosted runners usually have IPv6.

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${OLD_DATABASE_URL:-}" || { echo "::error::OLD_DATABASE_URL secret missing"; exit 1; }
          test -n "${DATABASE_URL:-}" || { echo "::error::DATABASE_URL secret missing"; exit 1; }

      - name: Dump schema from old project
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgdump"
          docker run --rm -v "$RUNNER_TEMP/pgdump:/out" -e OLD_DATABASE_URL postgres:17-alpine \
            sh -c 'pg_dump "$OLD_DATABASE_URL" --no-owner --no-acl --schema-only --schema=public > /out/schema.sql && wc -c /out/schema.sql'

      - name: Dump catalog data from old project
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/pgdump:/out" -e OLD_DATABASE_URL postgres:17-alpine \
            sh -c 'pg_dump "$OLD_DATABASE_URL" --no-owner --no-acl --data-only --schema=public \
              -t public.vendors \
              -t public.peptides \
              -t public.vendor_tests \
              -t public.vendor_products \
              -t public.site_content \
              -t public.billing_settings \
              -t public.email_settings \
              -t public.email_templates \
              > /out/data.sql && wc -c /out/data.sql'

      - name: Restore schema into new project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/pgdump:/in" -e DATABASE_URL postgres:17-alpine \
            sh -c 'psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -f /in/schema.sql'

      - name: Restore catalog data into new project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/pgdump:/in" -e DATABASE_URL postgres:17-alpine \
            sh -c 'psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -f /in/data.sql'

      - name: Promote catalog rows to real (non-demo) for local/demo UX
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm -e DATABASE_URL postgres:17-alpine \
            sh -c "psql \"\$DATABASE_URL\" --set ON_ERROR_STOP=1 -c \"
              update public.vendors set is_demo = false where true;
              update public.vendor_tests set is_demo = false where true;
            \""

      - name: Verify counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm -e DATABASE_URL postgres:17-alpine \
            sh -c "psql \"\$DATABASE_URL\" -Atc \"
              select 'vendors=' || count(*) from public.vendors;
              select 'peptides=' || count(*) from public.peptides;
              select 'vendor_tests=' || count(*) from public.vendor_tests;
              select 'vendor_products=' || count(*) from public.vendor_products;
            \""
